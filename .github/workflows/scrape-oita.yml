name: 大分県 データ取得

on:
  schedule:
    # 06:10 JST = 21:10 UTC(前日)
    - cron: "10 21 * * *"
  workflow_dispatch: {}

jobs:
  scrape-oita:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 大分県データ取得・パース・ジオコーディング
        run: python scripts/scrape_oita.py

      - name: 差分があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/oita_enforcement_points.json
          git diff --cached --quiet || git commit -m "data: 大分県 取締り予定を更新 ($(date -u +%Y-%m-%d))"
          git push
