plugins { id 'com.android.application' }

android {
    namespace 'com.obisumap.yamaguchi'
    compileSdk 36
    defaultConfig {
        applicationId 'com.obisumap.yamaguchi'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'yamaguchi-widget'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/widgetAssets')
    }
}
tasks.register('copyWidgetFeed', Copy) {
    from rootProject.file('../data/processed/widget_yamaguchi.json')
    into layout.buildDirectory.dir('generated/widgetAssets')
    rename 'widget_yamaguchi.json', 'bootstrap.json'
}
tasks.named('preBuild').configure { dependsOn 'copyWidgetFeed' }
tasks.matching { it.name.endsWith('JavaRes') || it.name.endsWith('Assets') }.configureEach { dependsOn 'copyWidgetFeed' }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
