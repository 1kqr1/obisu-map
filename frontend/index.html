<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>オービス情報マップ（山口県）</title>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>

      <aside id="panel">
        <header>
          <h1>オービス情報マップ</h1>
          <p class="subtitle">山口県 固定式・可搬式オービス情報（安全運転支援用）</p>
        </header>

        <form id="route-form">
          <label>
            出発地
            <input id="from-input" type="text" placeholder="例: 周南市徳山" required />
          </label>
          <label>
            目的地
            <input id="to-input" type="text" placeholder="例: 下関市長府" required />
          </label>
          <label>
            出発予定日
            <input id="date-input" type="date" />
          </label>
          <button type="submit">経路を検索</button>
          <button type="button" id="clear-route-button" hidden>経路をクリア</button>
        </form>

        <div id="route-status" role="status"></div>
        <div id="route-results"></div>

        <footer id="app-footer">
          <p id="last-updated"></p>
          <p class="disclaimer">
            取締り予定は各県警の公表情報に基づきますが、<strong>予告なく変更・中止される場合があります</strong>。
            可搬式オービスの取締り区間は、警察署管轄を市区町村境界で近似したものであり、
            実際の取締り地点はこの区間内のどこかです（ピンポイントの位置ではありません）。
            本アプリは取締り回避ではなく、事前の速度抑制・安全運転支援を目的としています。
          </p>
          <p class="attribution">
            地図: 国土地理院タイル / 道路データ: © OpenStreetMap contributors (ODbL) /
            住所検索: 国土地理院 / 経路検索: OSRM
          </p>
        </footer>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
